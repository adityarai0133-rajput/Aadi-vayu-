name: KYXGO Aadi-Vayu Build Engine

on: 
  push:
    branches: [ "main" ]
  push:
    tags:
      - 'v*' # Jab bhi v1.0 jaisa tag banayega tabhi release hoga
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Fetching Source Code
      uses: actions/checkout@v4

    - name: 2. Setting up Python Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 3. Installing KYXGO Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller

    - name: 4. Compiling Aadi-Vayu to EXE
      run: |
        pyinstaller --onefile --console --name Aadi-Vayu-v1 weather_vayu.py

    - name: 5. Archiving Executable (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Aadi-Vayu-Windows-Build
        path: dist/Aadi-Vayu-v1.exe

    - name: 6. Creating Official Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/Aadi-Vayu-v1.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
