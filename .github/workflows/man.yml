name: KYXGO Aadi-Vayu Android Build

on:
  push:
    tags:
      - 'v*' # Jab bhi tu v1.2, v1.3 jaisa tag banayega ye chalega
  workflow_dispatch: # Manual button ke liye bhi

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          # Fixed GStreamer packages for Ubuntu 24.04
          sudo apt-get install -y libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          pip install --user --upgrade buildozer Cython==0.29.33 virtualenv

      - name: 4. Build APK with Buildozer
        run: |
          # Pehle se config file nahi hai toh init karega
          if [ ! -f buildozer.spec ]; then
            buildozer init
            # Basic settings change karne ke liye sed use kar sakte hain
            sed -i 's/package.name = myapp/package.name = aadivayu/' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = org.kyxgo/' buildozer.spec
            sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,html,htm/' buildozer.spec
          fi
          # Build process (it takes 15-20 mins)
          buildozer -v android debug

      - name: 5. Upload APK to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
