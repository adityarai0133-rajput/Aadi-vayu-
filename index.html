<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYXGO | Aadi-Vayu Terminal</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --card: rgba(20, 20, 20, 0.8); }
        body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', monospace; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .dashboard { background: var(--card); border: 1px solid var(--neon); padding: 40px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); backdrop-filter: blur(10px); width: 90%; max-width: 500px; text-align: center; }
        .logo { font-size: 2.5rem; font-weight: bold; letter-spacing: 8px; margin-bottom: 10px; text-shadow: 0 0 10px var(--neon); }
        .tagline { color: #888; font-size: 0.9rem; margin-bottom: 30px; }
        .status-bar { border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 10px; margin: 20px 0; font-size: 0.8rem; display: flex; justify-content: space-between; }
        .btn { background: var(--neon); color: black; border: none; padding: 12px 30px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn:hover { box-shadow: 0 0 20px var(--neon); transform: scale(1.05); }
        .footer { margin-top: 30px; font-size: 0.7rem; color: #444; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="logo">AADI-VAYU</div>
        <div class="tagline">KYXGO TECHNOLOGY | DISASTER RESILIENCE SYSTEM</div>
        <div class="status-bar">
            <span>NETWORK: <span style="color:white">ENCRYPTED</span></span>
            <span class="blink">● SYSTEM ONLINE</span>
        </div>
        <p style="color: white; font-size: 0.9rem;">Satellite telemetry active. Core Engine 1.0.0 operational via .aadi protocol.</p>
        <button class="btn" onclick="alert('System Synchronized with KYXGO Cloud.')">Access Satellite Data</button>
        <div class="footer">DESIGNED BY ADITYA RAI | NF-1 SYNTAX STANDARDS</div>
    </div>
</body>
</html>
